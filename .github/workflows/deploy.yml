name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Internal links
        run: npm run audit:links
      - name: Media
        run: npm run audit:media
      - name: Atlas public evidence
        run: npm run audit:atlas-public
      - name: Orbital research
        run: npm run audit:orbital-research
      - name: Orbital experiment
        run: npm run audit:orbital-experiment
      - name: Display assets
        run: npm run audit:display
      - name: Build and prerender
        run: npm run build
      - name: Performance budget
        run: npm run performance:budget
      - name: Runtime SEO smoke test
        run: npm run audit:seo-runtime

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
